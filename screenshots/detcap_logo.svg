<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>DETCAP Logo — Cyberpunk Neon Glitch</title>
  <desc>DETCAP v1.0.1 logo in a dark cyberpunk aesthetic with neon cyan and magenta glitch effects</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Orbitron:wght@900&amp;display=swap');
      .main-text { font-family: 'Orbitron', 'Share Tech Mono', monospace; font-weight: 900; }
      .sub-text  { font-family: 'Share Tech Mono', monospace; }
      @keyframes glitch1 {
        0%,94%,100% { transform: translate(0,0); opacity:1; }
        95%          { transform: translate(-4px, 1px); opacity:0.8; }
        97%          { transform: translate(4px, -1px); opacity:0.85; }
      }
      @keyframes glitch2 {
        0%,91%,100% { transform: translate(0,0); opacity:0; }
        92%          { transform: translate(3px, 2px); opacity:0.5; }
        94%          { transform: translate(-3px, -2px); opacity:0.4; }
      }
      @keyframes scanline {
        0%   { transform: translateY(-10px); }
        100% { transform: translateY(340px); }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.6; }
        50%      { opacity: 1; }
      }
      @keyframes flicker {
        0%,100% { opacity:1; }
        92%      { opacity:1; }
        93%      { opacity:0.4; }
        94%      { opacity:1; }
        96%      { opacity:0.6; }
        97%      { opacity:1; }
      }
      .logo-anim { animation: glitch1 5s infinite; }
      .glitch-r  { animation: glitch2 5s infinite 0.04s; }
      .glitch-b  { animation: glitch2 5s 0.08s infinite; }
      .scan      { animation: scanline 3s linear infinite; }
      .pulse     { animation: pulse 2s ease-in-out infinite; }
      .flicker   { animation: flicker 6s infinite; }
    </style>

    <clipPath id="canvas-clip">
      <rect x="0" y="0" width="680" height="340"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#020810"/>
      <stop offset="100%" stop-color="#040d1a"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ffcc"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="340" fill="url(#bg-grad)"/>

  <!-- Grid lines horizontal -->
  <g clip-path="url(#canvas-clip)" opacity="0.07">
    <line x1="0" y1="40"  x2="680" y2="40"  stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="80"  x2="680" y2="80"  stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="680" y2="120" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="680" y2="160" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="680" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="680" y2="240" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="680" y2="280" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="680" y2="320" stroke="#00d4ff" stroke-width="0.5"/>
  </g>
  <!-- Grid lines vertical -->
  <g clip-path="url(#canvas-clip)" opacity="0.07">
    <line x1="68"  y1="0" x2="68"  y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="136" y1="0" x2="136" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="204" y1="0" x2="204" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="272" y1="0" x2="272" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="340" y1="0" x2="340" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="408" y1="0" x2="408" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="476" y1="0" x2="476" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="544" y1="0" x2="544" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="612" y1="0" x2="612" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.7">
    <polyline points="40,20 20,20 20,60"/>
    <polyline points="640,20 660,20 660,60"/>
    <polyline points="40,320 20,320 20,280"/>
    <polyline points="640,320 660,320 660,280"/>
  </g>

  <!-- Decorative horizontal bars -->
  <rect x="40" y="48" width="600" height="1" fill="url(#bar-grad)" class="pulse"/>
  <rect x="40" y="290" width="600" height="1" fill="url(#bar-grad)" class="pulse"/>

  <!-- Scanline sweep -->
  <rect class="scan" x="0" y="0" width="680" height="3" fill="#00d4ff" opacity="0.04" clip-path="url(#canvas-clip)"/>

  <!-- Glitch ghost — red (behind) -->
  <text class="glitch-r main-text" x="340" y="200"
        text-anchor="middle" font-size="110" letter-spacing="18"
        fill="none" stroke="#ff003c" stroke-width="0.5" opacity="0.6">DETCAP</text>

  <!-- Glitch ghost — blue (behind) -->
  <text class="glitch-b main-text" x="340" y="200"
        text-anchor="middle" font-size="110" letter-spacing="18"
        fill="none" stroke="#0066ff" stroke-width="0.5" opacity="0.5">DETCAP</text>

  <!-- Main logo text -->
  <g class="logo-anim flicker">
    <text class="main-text" x="340" y="200"
          text-anchor="middle" font-size="110" letter-spacing="18"
          fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.5">DETCAP</text>
    <text class="main-text" x="340" y="200"
          text-anchor="middle" font-size="110" letter-spacing="18"
          fill="url(#cyan-grad)">DETCAP</text>
  </g>

  <!-- Glitch bar slice -->
  <g clip-path="url(#canvas-clip)" class="glitch-r">
    <rect x="0" y="162" width="680" height="8" fill="#020810"/>
    <text class="main-text" x="344" y="170"
          text-anchor="middle" font-size="110" letter-spacing="18"
          fill="#ff003c" opacity="0.5">DETCAP</text>
  </g>

  <!-- Tagline -->
  <text class="sub-text" x="340" y="234"
        text-anchor="middle" font-size="11" letter-spacing="6"
        fill="#00d4ff" opacity="0.6">AI-POWERED NETWORK RECON</text>

  <!-- Version pill -->
  <rect x="296" y="248" width="88" height="18" rx="3" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <text class="sub-text" x="340" y="261"
        text-anchor="middle" font-size="10" letter-spacing="3"
        fill="#00d4ff" opacity="0.7">v1.0.1</text>

  <!-- Bottom hex decorations -->
  <g opacity="0.35" fill="#00d4ff" class="sub-text" font-size="9" letter-spacing="1">
    <text x="52" y="310">0x4445</text>
    <text x="52" y="322">5443</text>
    <text x="580" y="310" text-anchor="end">4150</text>
    <text x="580" y="322" text-anchor="end">0x01</text>
  </g>

  <!-- Small dot accents -->
  <g fill="#00d4ff" opacity="0.5">
    <circle cx="40" cy="170" r="2"/>
    <circle cx="640" cy="170" r="2"/>
    <circle cx="40" cy="175" r="1"/>
    <circle cx="640" cy="175" r="1"/>
  </g>

  <!-- Magenta accent line -->
  <rect x="260" y="214" width="160" height="1" fill="#ff00aa" opacity="0.4"/>

</svg>
